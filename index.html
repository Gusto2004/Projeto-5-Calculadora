<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="dark">
    <main class="app">
      <div class="topo">
        <button id="toggle-tema" class="toggle-tema" aria-label="Alternar tema">
          ☀️
        </button>
      </div>
      <h1>Calculadora</h1>

      <input type="number" id="numero1" placeholder="Primeiro número" />

      <select id="operacao">
        <option value="somar">+ (somar)</option>
        <option value="subtrair">− (subtrair)</option>
        <option value="multiplicar">× (multiplicar)</option>
        <option value="dividir">÷ (dividir)</option>
      </select>

      <input type="number" id="numero2" placeholder="Segundo número" />

      <button id="calcular">Calcular</button>

      <div id="resultado" class="resultado"></div>

      <ul id="historico" class="historico"></ul>
    </main>

    <script src="calculator.js"></script>
  </body>
</html>
